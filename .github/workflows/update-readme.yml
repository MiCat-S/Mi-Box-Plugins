name: Update README Plugin List

# The list in README.md is generated from plugins.json by
# scripts/update-readme.js. A pull request only checks it; a push to main
# regenerates it and commits the result.
on:
  push:
    branches: [main]
    paths:
      - plugins.json
      - README.md
      - '*/v2.ts'
      - scripts/update-readme.js
      - .github/workflows/update-readme.yml
  pull_request:
    paths:
      - plugins.json
      - README.md
      - '*/v2.ts'
      - scripts/update-readme.js
      - .github/workflows/update-readme.yml
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the plugin list
        if: github.event_name == 'pull_request'
        run: node scripts/update-readme.js --check
      - name: Regenerate and commit the plugin list
        if: github.event_name != 'pull_request'
        run: |
          node scripts/update-readme.js
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: 同步 README 插件列表" -- README.md
          git push
